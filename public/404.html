<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Страница не найдена — ScanFlow</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f6f3; --card: #ffffff; --border: #e9e9e7; --text: #37352f;
      --dim: #787774; --accent: #2383e2; --accent-hover: #1a72c9;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1f1e1b; --card: #2b2a26; --border: rgba(255,255,255,0.08); --text: #ecebe8; --dim: #a5a39d; --accent: #4a9ee8; --accent-hover: #6cb2f0; color-scheme: dark; }
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: 'Onest', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      line-height: 1.6;
    }
    main { max-width: 520px; text-align: center; }
    .logo { display: inline-flex; align-items: center; gap: 10px; color: var(--accent); text-decoration: none; margin-bottom: 40px; }
    .logo span { color: var(--text); font-weight: 600; font-size: 19px; }
    .code { font-family: 'Unbounded', 'Onest', sans-serif; font-weight: 800; font-size: clamp(72px, 18vw, 128px); line-height: 1; letter-spacing: -0.04em; color: var(--accent); }
    h1 { font-family: 'Unbounded', 'Onest', sans-serif; font-weight: 700; font-size: 24px; margin: 18px 0 12px; }
    p { color: var(--dim); font-size: 16px; }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 28px; }
    .btn { display: inline-flex; align-items: center; padding: 12px 20px; border-radius: 8px; font-weight: 600; font-size: 15px; text-decoration: none; }
    .btn--primary { background: var(--accent); color: #fff; }
    .btn--primary:hover { background: var(--accent-hover); }
    .btn--ghost { color: var(--text); border: 1px solid var(--border); background: var(--card); }
    .btn:focus-visible, .logo:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <a href="/" class="logo" aria-label="ScanFlow — на главную">
      <svg width="28" height="28" viewBox="0 0 40 40" fill="none" aria-hidden="true">
        <rect x="2" y="2" width="36" height="36" rx="8" stroke="currentColor" stroke-width="2.5"/>
        <line x1="10" y1="14" x2="30" y2="14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <line x1="10" y1="20" x2="26" y2="20" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
        <line x1="10" y1="26" x2="22" y2="26" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
      </svg>
      <span>ScanFlow</span>
    </a>
    <div class="code" aria-hidden="true">404</div>
    <h1>Страница не найдена</h1>
    <p>Такого адреса на сайте нет. Возможно, ссылка устарела или в ней опечатка.</p>
    <div class="actions">
      <a href="/" class="btn btn--primary">На главную</a>
      <a href="/blog" class="btn btn--ghost">Блог</a>
      <a href="/app.html" class="btn btn--ghost">Кабинет</a>
    </div>
  </main>
</body>
</html>
