<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Страница не найдена — ScanFlow</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/geist-v5-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/geist-v5-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/fonts.css">
  <style>
    :root {
      --bg: #fafafa; --card: #ffffff; --border: #e8e8e8; --text: #171717;
      --dim: #525252; --accent: #1a6ed8; --accent-hover: #155fbd;
      --from: #000000; --to: #666666;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #000000; --card: #181818; --border: #313131; --text: #ededed; --dim: #a1a1a1; --accent: #1a6ed8; --accent-hover: #2a7ce3; --from: #ffffff; --to: #9b9b9b; color-scheme: dark; }
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 32px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif;
      font-size: 16px;
      line-height: 24px;
      -webkit-font-smoothing: antialiased;
    }
    main { max-width: 520px; text-align: center; }
    .logo { display: inline-flex; align-items: center; gap: 8px; color: var(--accent); text-decoration: none; margin-bottom: 48px; border-radius: 8px; }
    .logo span { color: var(--text); font-weight: 600; font-size: 18px; line-height: 28px; letter-spacing: -0.02em; }
    .code { font-weight: 600; font-size: 128px; line-height: 1; letter-spacing: -0.05em; background: linear-gradient(90deg, var(--from), var(--to)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    h1 { font-weight: 600; font-size: 24px; line-height: 32px; letter-spacing: -0.02em; margin: 24px 0 12px; text-wrap: balance; }
    p { color: var(--dim); text-wrap: pretty; }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 32px; }
    .btn { display: inline-flex; align-items: center; padding: 8px 16px; border: 1px solid transparent; border-radius: 9999px; font-weight: 600; font-size: 16px; line-height: 24px; text-decoration: none; transition: background-color 300ms cubic-bezier(0.22, 1, 0.36, 1), transform 500ms cubic-bezier(0.22, 1, 0.36, 1); }
    .btn:active { transform: scale(0.98); }
    .btn--primary { background: var(--accent); color: #fff; }
    .btn--primary:hover { background: var(--accent-hover); }
    .btn--ghost { color: var(--text); border-color: var(--border); background: var(--card); }
    .btn--ghost:hover { border-color: var(--dim); }
    .btn:focus-visible, .logo:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    @media (max-width: 480px) { .code { font-size: 96px; } }
  </style>
</head>
<body>
  <main>
    <a href="/" class="logo" aria-label="ScanFlow — на главную">
      <svg width="28" height="28" viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <rect width="64" height="64" rx="16" fill="currentColor"/>
        <path d="M17 21.5h30" stroke="#fff" stroke-width="5.5" stroke-linecap="round"/>
        <path d="M17 32h23" stroke="#fff" stroke-width="5.5" stroke-linecap="round" opacity="0.78"/>
        <path d="M17 42.5h16" stroke="#fff" stroke-width="5.5" stroke-linecap="round" opacity="0.56"/>
      </svg>
      <span>ScanFlow</span>
    </a>
    <div class="code" aria-hidden="true">404</div>
    <h1>Страница не найдена</h1>
    <p>Такого адреса на сайте нет. Возможно, ссылка устарела или&nbsp;в&nbsp;ней опечатка.</p>
    <div class="actions">
      <a href="/" class="btn btn--primary">На главную</a>
      <a href="/blog" class="btn btn--ghost">Блог</a>
      <a href="/app.html" class="btn btn--ghost">Кабинет</a>
    </div>
  </main>
</body>
</html>
