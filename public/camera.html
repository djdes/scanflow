<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Фото накладной</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f3f4f6;
      color: #111827;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      background: #2563eb;
      color: #fff;
      padding: 16px;
      text-align: center;
      font-size: 18px;
      font-weight: 600;
    }
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 16px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 24px;
      border: none;
      border-radius: 12px;
      font-size: 20px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }
    .btn-camera {
      background: #2563eb;
      color: #fff;
      min-height: 80px;
    }
    .btn-camera:active { background: #1d4ed8; }
    .btn-camera:disabled { background: #9ca3af; }
    #file-input { display: none; }

    .history {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .history-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #fff;
      border-radius: 8px;
      padding: 8px;
      border: 1px solid #e5e7eb;
    }
    .history-item img {
      width: 50px;
      height: 66px;
      object-fit: cover;
      border-radius: 4px;
    }
    .history-item .info {
      flex: 1;
      font-size: 14px;
    }
    .history-item .status-icon {
      font-size: 20px;
    }

    .status {
      text-align: center;
      padding: 12px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 500;
    }
    .status-success { background: #dcfce7; color: #166534; }
    .status-error { background: #fef2f2; color: #991b1b; }
    .status-loading { background: #dbeafe; color: #1e40af; }

    .counter {
      text-align: center;
      color: #6b7280;
      font-size: 14px;
      padding: 8px;
    }
    .field {
      width: 100%;
      padding: 16px;
      font-size: 17px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      background: #fff;
    }
    .field:focus { outline: none; border-color: #2563eb; }
    .hint { text-align: center; color: #6b7280; font-size: 14px; }
    .logout { text-align: center; }
    .logout a { color: #6b7280; font-size: 13px; text-decoration: none; }
  </style>
</head>
<body>
  <div class="header">Фото накладной</div>

  <div class="main">
    <!-- Логин: показывается, пока в браузере нет ключа компании. Сама страница
         /camera публична (LAN), но загрузка идёт под ключом конкретного
         пользователя — так накладная привязывается к его компании. -->
    <div id="login-box" style="display:none; flex-direction:column; gap:12px">
      <div class="hint">Войдите в аккаунт компании, чтобы загружать фото</div>
      <input id="login-user" class="field" placeholder="Логин" autocomplete="username" autocapitalize="none">
      <input id="login-pass" class="field" type="password" placeholder="Пароль" autocomplete="current-password">
      <button class="btn btn-camera" id="btn-login">Войти</button>
    </div>

    <!-- Камера: показывается после входа -->
    <div id="camera-box" style="display:none; flex-direction:column; gap:16px">
      <input type="file" id="file-input" accept="image/*" capture="environment">
      <button class="btn btn-camera" id="btn-camera">Сфотографировать</button>
      <div class="logout"><a href="#" id="logout-link">Выйти</a></div>
    </div>

    <div id="status"></div>

    <div class="counter" id="counter"></div>

    <div class="history" id="history"></div>
  </div>

  <script>
    // Ключ хранится в том же localStorage['apiKey'], что и основной кабинет —
    // если пользователь уже вошёл в ЛК на этом устройстве, камера подхватит
    // вход без повторной авторизации. Хардкод ключа убран: он бы утёк любому в
    // LAN (страница публичная) и в мультиарендной модели привязал бы накладные
    // к чужой компании.
    let apiKey = localStorage.getItem('apiKey') || '';
    let totalUploaded = 0;
    const history = []; // { url, name, status }

    const loginBox = document.getElementById('login-box');
    const cameraBox = document.getElementById('camera-box');
    const loginUser = document.getElementById('login-user');
    const loginPass = document.getElementById('login-pass');
    const btnLogin = document.getElementById('btn-login');
    const logoutLink = document.getElementById('logout-link');
    const fileInput = document.getElementById('file-input');
    const btnCamera = document.getElementById('btn-camera');
    const statusEl = document.getElementById('status');
    const counterEl = document.getElementById('counter');
    const historyEl = document.getElementById('history');

    function showLogin(message) {
      apiKey = '';
      localStorage.removeItem('apiKey');
      loginBox.style.display = 'flex';
      cameraBox.style.display = 'none';
      statusEl.innerHTML = message ? `<div class="status status-error">${message}</div>` : '';
    }
    function showCamera() {
      loginBox.style.display = 'none';
      cameraBox.style.display = 'flex';
    }

    // Стартовый экран зависит от того, есть ли уже ключ.
    if (apiKey) showCamera(); else showLogin();

    async function doLogin() {
      const username = loginUser.value.trim();
      const password = loginPass.value;
      if (!username || !password) {
        statusEl.innerHTML = '<div class="status status-error">Введите логин и пароль</div>';
        return;
      }
      btnLogin.disabled = true;
      statusEl.innerHTML = '<div class="status status-loading">Вход...</div>';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.apiKey) {
          throw new Error(data.error || 'Неверный логин или пароль');
        }
        apiKey = data.apiKey;
        localStorage.setItem('apiKey', apiKey);
        loginPass.value = '';
        statusEl.innerHTML = '';
        showCamera();
      } catch (err) {
        statusEl.innerHTML = `<div class="status status-error">${err.message}</div>`;
      } finally {
        btnLogin.disabled = false;
      }
    }

    btnLogin.addEventListener('click', doLogin);
    loginPass.addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
    logoutLink.addEventListener('click', (e) => { e.preventDefault(); showLogin(); });

    btnCamera.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      fileInput.value = '';

      const now = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      const ts = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}_${pad(now.getHours())}-${pad(now.getMinutes())}-${pad(now.getSeconds())}`;
      const fileName = `photo_${ts}.jpg`;

      const url = URL.createObjectURL(file);
      const idx = history.length;
      history.push({ url, name: fileName, status: 'uploading' });
      renderHistory();

      btnCamera.disabled = true;
      statusEl.innerHTML = '<div class="status status-loading">Загрузка...</div>';

      try {
        const formData = new FormData();
        formData.append('file', file, fileName);

        const response = await fetch(`/api/upload?filename=${encodeURIComponent(fileName)}`, {
          method: 'POST',
          headers: { 'X-API-Key': apiKey },
          body: formData,
        });

        if (response.status === 401) {
          // Ключ протух или отозван — возвращаем на экран входа.
          history[idx].status = 'error';
          renderHistory();
          showLogin('Сессия истекла — войдите заново');
          return;
        }
        if (!response.ok) {
          const err = await response.json().catch(() => ({}));
          throw new Error(err.error || `HTTP ${response.status}`);
        }

        const result = await response.json();
        totalUploaded++;
        history[idx].status = 'ok';
        statusEl.innerHTML = `<div class="status status-success">Загружено! (#${result.invoice_id})</div>`;
      } catch (err) {
        history[idx].status = 'error';
        statusEl.innerHTML = `<div class="status status-error">Ошибка: ${err.message}</div>`;
      } finally {
        btnCamera.disabled = false;
        counterEl.textContent = totalUploaded > 0 ? `Загружено за сессию: ${totalUploaded}` : '';
        renderHistory();
      }
    });

    function renderHistory() {
      historyEl.innerHTML = history.slice().reverse().map(h => {
        const icon = h.status === 'ok' ? '&#10004;' : h.status === 'error' ? '&#10008;' : '&#8987;';
        const color = h.status === 'ok' ? '#16a34a' : h.status === 'error' ? '#dc2626' : '#2563eb';
        return `<div class="history-item">
          <img src="${h.url}" alt="">
          <div class="info">${h.name}</div>
          <div class="status-icon" style="color:${color}">${icon}</div>
        </div>`;
      }).join('');
    }
  </script>
</body>
</html>
