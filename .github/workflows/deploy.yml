name: Deploy to scanflow.ru

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Secret scan — refuse to deploy if real credentials leaked in
        run: |
          # Anthropic live keys are at least 60 chars after the sk-ant- prefix
          # (real ones are ~100). This regex is tight enough to ignore the
          # "sk-ant-api03-..." placeholders used in docs and .env.example.
          SECRETS_REGEX='sk-ant-api03-[A-Za-z0-9_-]{60,}|AIza[0-9A-Za-z_-]{35}|"private_key": ?"-----BEGIN'
          if git grep -E "$SECRETS_REGEX" -- ':!.github/workflows/deploy.yml' ':!.gitignore'; then
            echo "::error::Live credential pattern found in tracked files. Refusing to deploy."
            exit 1
          fi

      - name: Run tests
        run: npm test

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Best-effort keyscan; we also use StrictHostKeyChecking=accept-new below as a safety net
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -T 10 ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>&1 || echo "keyscan failed, relying on accept-new"

      - name: Deploy via rsync
        run: |
          # Exclude ALL of data/, logs/, backups/ to avoid overwriting/ deleting
          # server-side state. The --exclude='data/*.sqlite*' patterns catch
          # database files that might land in the repo by accident.
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='data' \
            --exclude='logs' \
            --exclude='google-credentials.json' \
            --exclude='certs' \
            --exclude='*.log' \
            --exclude='*.sqlite' \
            --exclude='*.sqlite-shm' \
            --exclude='*.sqlite-wal' \
            --exclude='.claude' \
            --exclude='.playwright-mcp' \
            --exclude='.vscode' \
            --exclude='nul' \
            --exclude='eng.traineddata' \
            --exclude='rus.traineddata' \
            --exclude='temp_invoice.json' \
            --exclude='cwww1C-JPGExchangetemp_invoice.json' \
            --exclude='architecture.excalidraw' \
            --exclude='architecture.png' \
            --exclude='improvements.excalidraw' \
            --exclude='improvements.png' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=accept-new" \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/www/scanflow.ru/app/

      - name: Install dependencies and restart
        env:
          ANTHROPIC_PROXY_URL: ${{ secrets.ANTHROPIC_PROXY_URL }}
        run: |
          ANTHROPIC_PROXY_URL_B64="$(printf '%s' "$ANTHROPIC_PROXY_URL" | base64 -w 0)"
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=accept-new ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "ANTHROPIC_PROXY_URL_B64='$ANTHROPIC_PROXY_URL_B64' bash -s" << 'ENDSSH'
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

          cd ~/www/scanflow.ru/app

          # Create data dirs if missing
          mkdir -p data/inbox data/processed data/failed

          # Install all dependencies (need devDeps for tsc)
          npm ci 2>&1 || npm install 2>&1

          # Build TypeScript
          npm run build 2>&1

          # Prune dev dependencies
          npm prune --production 2>&1

          # Enable multi-tenant data isolation via the server-only .env (rsync
          # excludes .env, so the pipeline sets it here — no manual server edit).
          # Idempotent. To DISABLE later, change =true to =false here and redeploy.
          # The app reads DATA_SCOPING_ENABLED at startup (dotenv), picked up on
          # the pm2 restart below.
          if [ -f .env ]; then
            if grep -q '^DATA_SCOPING_ENABLED=' .env; then
              sed -i 's/^DATA_SCOPING_ENABLED=.*/DATA_SCOPING_ENABLED=true/' .env
            else
              echo 'DATA_SCOPING_ENABLED=true' >> .env
            fi
            echo "DATA_SCOPING_ENABLED=true ensured in .env"
          else
            echo "WARNING: .env not found — DATA_SCOPING_ENABLED not set"
          fi

          # Keep the proxy credential in GitHub Secrets and the server-only .env.
          # Replace just this key while preserving every other production value.
          if [ -n "$ANTHROPIC_PROXY_URL_B64" ]; then
            proxy_url="$(printf '%s' "$ANTHROPIC_PROXY_URL_B64" | base64 -d)"
            touch .env
            awk '!/^ANTHROPIC_PROXY_URL=/' .env > .env.proxy.tmp
            printf 'ANTHROPIC_PROXY_URL=%s\n' "$proxy_url" >> .env.proxy.tmp
            chmod 600 .env.proxy.tmp
            mv .env.proxy.tmp .env
            echo "ANTHROPIC_PROXY_URL ensured in .env"
          else
            echo "WARNING: ANTHROPIC_PROXY_URL GitHub secret is empty"
          fi

          # Restart with PM2
          pm2 startOrRestart ecosystem.config.js 2>&1
          pm2 save 2>&1

          # Give the app a moment to bind to the port, then hit /health.
          # A 200 body with {"ok":true,...} means migrations ran, DB is good,
          # and the static dashboard is reachable. Exit non-zero on failure so
          # the workflow goes red and someone notices.
          sleep 5
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 5 http://localhost:8899/health | grep -q '"status":"ok"'; then
              echo "Health check passed (attempt $i)"
              HEALTH_OK=1
              break
            fi
            echo "Health check attempt $i failed, retrying in 3s..."
            sleep 3
          done

          if [ -z "$HEALTH_OK" ]; then
            echo "Health check FAILED after deploy. Showing last 50 PM2 log lines:"
            pm2 logs scanflow --nostream --lines 50 2>&1 || true
            exit 1
          fi

          echo "Deploy complete!"
          ENDSSH

      - name: Verify public endpoint
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 10 https://scanflow.ru/health | grep -q '"status":"ok"'; then
              echo "Public health check passed (attempt $i)"
              exit 0
            fi
            echo "Public health check attempt $i failed, retrying in 5s..."
            sleep 5
          done

          echo "::error::Public endpoint is unavailable after deploy"
          exit 1
