# Ежемесячные сгруппированные обновления: минимум шума, максимум закрытых уязвимостей.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    # Версии зафиксированы точно (правило 39 CLAUDE.md): обновлять только с проверкой на Node 20.
    ignore:
      - dependency-name: "pdfjs-dist"
      - dependency-name: "@napi-rs/canvas"
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
