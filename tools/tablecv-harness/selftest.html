<!DOCTYPE html>
<html lang="ru">
<head><meta charset="utf-8"><title>TableCV harness</title>
<style>body{font:13px sans-serif;margin:8px}canvas{max-width:100%;border:1px solid #ccc}</style></head>
<body>
<div id="status">init</div>
<canvas id="tablecv-canvas"></canvas>
<pre id="dump"></pre>

<script src="/public/js/tablecv/gridCore.js"></script>
<script src="/public/js/tablecv/export.js"></script>
<script src="/public/js/tablecv/ocrClean.js"></script>
<script src="/public/js/tablecv/loader.js"></script>
<script src="/public/js/tablecv/preprocess.js"></script>
<script src="/public/js/tablecv/gridDetect.js"></script>
<script src="/public/js/tablecv/cellOcr.js"></script>
<script src="/public/js/tablecv/overlay.js"></script>

<script>
/* global cv, TableCVLoader, TableCVPre, TableCVDetect, TableCVOverlay, TableCVOcr */
// Usage:
//   ?img=/data/processed/<file>        full pipeline (geometry + OCR + orient)
//   ?img=...&geom=1                     geometry only (fast, for batch metrics)
const S = (m) => { document.getElementById('status').textContent = m; };
const qp = new URLSearchParams(location.search);
const IMG = qp.get('img');
const GEOM = qp.get('geom') === '1';
window.__phase = 'start'; window.__result = null; window.__error = null;
const loadImage = (src) => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });

(async () => {
  try {
    if (!IMG) throw new Error('no ?img=');
    await TableCVLoader.ensure(S);
    const img = await loadImage(IMG + (IMG.includes('?') ? '&' : '?') + Date.now());
    const pre = TableCVPre.run(img, { maxSide: 2000, blockSize: 25 });
    const opts = { blockSize: 25, lineKernelFrac: 0.12, projFrac: 0.2 };
    const cands = TableCVDetect.allOrientations(pre.gray, opts);
    pre.gray.delete(); pre.binary.delete();
    if (!cands.length) { window.__phase = 'done'; window.__result = { cellCount: 0 }; S('no table'); return; }
    cands.forEach((c) => { c.det.hMask.delete(); c.det.vMask.delete(); });

    let gbest = cands[0];
    for (const c of cands) if (c.det.cells.length > gbest.det.cells.length) gbest = c;
    TableCVOverlay.draw('tablecv-canvas', gbest.gray, gbest.det.cells, -1);

    const baseResult = {
      geomBestRot: gbest.rot, geomBestCells: gbest.det.cells.length,
      region: gbest.det.region && { x: gbest.det.region.x, y: gbest.det.region.y, w: gbest.det.region.width, h: gbest.det.region.height },
      working: [gbest.gray.cols, gbest.gray.rows],
    };

    if (GEOM) {
      window.__result = baseResult;
      cands.forEach((c) => { c.gray.delete(); c.binary.delete(); });
      window.__phase = 'done'; S('GEOM cells=' + gbest.det.cells.length + ' rot=' + gbest.rot);
      return;
    }

    const picked = await TableCVOcr.runOriented(
      cands.map((c) => ({ gray: c.gray, cells: c.det.cells, region: c.det.region })),
      (d, t, m) => S(m || ('OCR ' + d + '/' + t)));
    TableCVOverlay.draw('tablecv-canvas', picked.gray, picked.cells, -1);

    window.__result = Object.assign(baseResult, {
      pickedRot: cands[picked.index] ? cands[picked.index].rot : null,
      confidence: Math.round(picked.confidence),
      cellCount: picked.cells.length,
      cells: picked.cells.map((c) => ({ r: c.row, col: c.col, rs: c.rowSpan, cs: c.colSpan, text: c.text, conf: Math.round(c.confidence || 0) })),
    });
    document.getElementById('dump').textContent = JSON.stringify(window.__result.cells.filter((c) => c.text).map((c) => c.text), null, 1);
    cands.forEach((c) => { c.gray.delete(); c.binary.delete(); });
    window.__phase = 'done'; S('DONE cells=' + picked.cells.length + ' rot=' + window.__result.pickedRot);
  } catch (e) { window.__error = String(e && e.stack || e); window.__phase = 'error'; S('ERROR: ' + (e && e.message || e)); }
})();
</script>
</body>
</html>
